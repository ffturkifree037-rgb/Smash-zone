<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMASH ZONE</title><style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial;background-image:radial-gradient(circle at 15% 15%,#3a2908 0,transparent 28%),radial-gradient(circle at 90% 75%,#2a1d05 0,transparent 25%)}header{position:sticky;top:0;z-index:5;background:#090909ee;border-bottom:1px solid #3d2c0b;padding:15px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:900}.gold{color:#d9a441}.topbtn{background:#171717;color:#fff;border:1px solid #5b4314;border-radius:13px;padding:10px 13px}.hero{margin:18px 0;padding:28px 20px;border-radius:25px;background:linear-gradient(135deg,#17130b,#0d0d0d);border:1px solid #6d5016;box-shadow:0 8px 30px #000}.hero h1{font-size:42px;margin:0;color:#e3ae43}.hero p{color:#ccc}.wrap{max-width:680px;margin:auto;padding:0 15px 90px}.tabs{display:flex;gap:8px;overflow:auto;padding:5px 0 12px}.tab{white-space:nowrap;background:#171717;color:#bbb;border:1px solid #333;border-radius:12px;padding:9px 13px}.active{background:#d9a441;color:#111}.card{display:flex;align-items:center;gap:13px;background:#151515;border:1px solid #242424;border-radius:18px;padding:13px;margin:10px 0}.emoji{font-size:43px}.info{flex:1}.name{font-size:18px;font-weight:bold}.desc{color:#999;margin:5px 0}.price{color:#e0aa3d;font-weight:bold}.add{background:#d9a441;border:0;border-radius:12px;width:42px;height:42px;font-size:25px}.page{display:none}.row{display:flex;align-items:center;gap:10px;background:#151515;border-radius:14px;padding:12px;margin:8px 0}.qty{margin-right:auto;color:#d9a441}.btn{width:100%;padding:15px;border:0;border-radius:14px;margin-top:12px;font-weight:bold}.goldbtn{background:#d9a441;color:#111}.darkbtn{background:#1a1a1a;color:#fff}.input{width:100%;padding:13px;background:#151515;color:#fff;border:1px solid #444;border-radius:12px;margin:7px 0 12px}nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:#111;border-top:1px solid #333;display:flex;justify-content:space-around;z-index:10}nav button{background:none;border:0;color:#888;font-size:12px}nav .sel{color:#d9a441}
</style></head><body><header><div class="logo">SMASH <span class="gold">ZONE</span></div><button class="topbtn" onclick="show('cart')">🛒 <b id="count">0</b></button></header><div class="wrap">
<section id="home" class="page" style="display:block"><div class="hero"><h1>SMASH ZONE 🔥</h1><p>🍔 طازج • ساخن • لذيذ</p><p>📍 العامرات — بالقرب من جامع الصحابة</p></div><h2>🍽️ القائمة</h2><div id="tabs" class="tabs"></div><div id="products"></div></section>
<section id="cart" class="page"><h2>🛒 سلة الطلب</h2><div id="cartItems"></div><h3>الإجمالي: <span id="total" class="gold">0.00 ر.ع</span></h3><button class="btn goldbtn" onclick="alert('تم تأكيد الطلب تجريبيًا ✅')">تأكيد الطلب 🚗</button></section>
<section id="account" class="page"><h2>👤 حسابي</h2><p>احفظ بياناتك لطلباتك القادمة.</p><label>الاسم</label><input class="input" id="an" placeholder="اسمك"><label>رقم الهاتف</label><input class="input" id="ap" placeholder="رقم الهاتف"><label>العنوان</label><input class="input" id="aa" placeholder="منطقة التوصيل"><button class="btn goldbtn" onclick="saveAccount()">💾 حفظ الحساب</button><div id="saved"></div></section>
</div><nav><button id="nh" class="sel" onclick="show('home')">🏠<br>الرئيسية</button><button id="nc" onclick="show('cart')">🛒<br>السلة</button><button id="na" onclick="show('account')">👤<br>حسابي</button></nav>
<script>
const items=[
['🍔','SMASH Classic','لحم سماش، جبن، صوص خاص',1.9,'برجر'],['🍔','Double SMASH','قطعتان لحم سماش، جبن وصوص',2.5,'برجر'],['🌶️','SMASH Spicy','لحم سماش، جبن وهالبينو وصوص حار',2.2,'برجر'],['🍗','SMASH Chicken','دجاج مقرمش، جبن، صوص',1.7,'دجاج'],['🍗','Chicken Crunch','دجاج مقرمش، خس، جبن وصوص',1.9,'دجاج'],['🌯','شاورما بالصوص','شاورما مع صوص SMASH ZONE',1.3,'شاورما'],['🌯','تويستر حار','تويستر دجاج حار مع صوص',1.5,'شاورما'],['🍱','SMASH Box','برجر + بطاطس + مشروب',3.2,'وجبات'],['🫓','خبز عربي','خبز عربي طازج',.3,'إضافات'],['🍟','SMASH Fries','بطاطس مع صوص المطعم',.8,'إضافات'],['🧀','Cheese Fries','بطاطس مع صوص الجبن',1.2,'إضافات'],['🥤','Cola','مشروب غازي بارد',.5,'مشروبات'],['💧','Water','مياه معدنية',.2,'مشروبات']];
let cart=[];
const cats=['الكل','برجر','دجاج','شاورما','وجبات','إضافات','مشروبات'];tabs.innerHTML=cats.map((c,i)=>`<button class="tab ${i?'':'active'}" onclick="filter('${c}',this)">${c}</button>`).join('');
function render(list=items){products.innerHTML=list.map((x,i)=>`<div class="card"><div class="emoji">${x[0]}</div><div class="info"><div class="name">${x[1]}</div><div class="desc">${x[2]}</div><div class="price">${x[3].toFixed(2)} ر.ع</div></div><button class="add" onclick="add(${items.indexOf(x)})">+</button></div>`).join('')}
function filter(c,b){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(c==='الكل'?items:items.filter(x=>x[4]===c))}
function add(i){cart.push(i);renderCart();show('cart')}
function renderCart(){count.textContent=cart.length;let t=0;cartItems.innerHTML=cart.length?cart.map((i)=>{let x=items[i];t+=x[3];return `<div class="row"><span class="emoji">${x[0]}</span><div class="info"><b>${x[1]}</b><br><span class="price">${x[3].toFixed(2)} ر.ع</span></div><span class="qty">×1</span></div>`}).join(''):'<p>السلة فارغة 🛒</p>';total.textContent=t.toFixed(2)+' ر.ع'}
function show(id){document.querySelectorAll('.page').forEach(x=>x.style.display='none');document.getElementById(id).style.display='block';document.querySelectorAll('nav button').forEach(x=>x.classList.remove('sel'));({home:'nh',cart:'nc',account:'na'})[id]&&document.getElementById(({home:'nh',cart:'nc',account:'na'})[id]).classList.add('sel');scrollTo(0,0);if(id==='cart')renderCart()}
function saveAccount(){localStorage.setItem('smashAccount',JSON.stringify({n:an.value,p:ap.value,a:aa.value}));saved.innerHTML='<div style="margin-top:15px;color:#d9a441">تم حفظ الحساب ✅</div>'}
let a=JSON.parse(localStorage.getItem('smashAccount')||'null');if(a){an.value=a.n;ap.value=a.p;aa.value=a.a}render();renderCart();
</script></body></html>
