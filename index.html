<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909"><title>SMASH ZONE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif}
header{padding:18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#090909ee;z-index:5}
.logo{font-size:26px;font-weight:900}.gold{color:#d9a441}.cart{background:#191919;border:0;color:#fff;padding:11px 15px;border-radius:14px;font-weight:bold}
main{max-width:650px;margin:auto;padding:0 18px 100px}.hero{background:#171717;border:1px solid #33260f;border-radius:24px;padding:28px;margin:12px 0 26px}
.hero h1{margin:0;color:#d9a441;font-size:38px}.hero p{color:#bbb}.title{font-size:22px;margin:18px 0}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.tab{background:#191919;color:#aaa;border:1px solid #333;border-radius:12px;padding:9px 12px;white-space:nowrap}.active{background:#d9a441;color:#090909}
.card{background:#151515;border-radius:18px;padding:14px;margin:12px 0;display:flex;align-items:center;gap:13px}.emoji{font-size:42px}.info{flex:1}.name{font-size:18px;font-weight:bold}.desc{color:#999;margin:5px 0}.price{color:#d9a441;font-weight:bold}
.add{border:0;background:#d9a441;color:#090909;font-size:26px;width:42px;height:42px;border-radius:12px;font-weight:900}
.row{display:flex;align-items:center;background:#151515;padding:14px;border-radius:15px;margin:9px 0}.total{display:flex;justify-content:space-between;border-top:1px solid #333;padding-top:18px;margin-top:18px;font-size:19px;font-weight:bold}
.btn{width:100%;border:0;border-radius:15px;padding:16px;margin-top:15px;font-weight:bold;font-size:16px}.goldBtn{background:#d9a441}.darkBtn{background:#191919;color:#fff}
.note{background:#171717;padding:14px;border-radius:14px;color:#bbb;line-height:1.7;margin-top:15px}input{width:100%;background:#151515;color:#fff;border:1px solid #333;border-radius:13px;padding:14px;margin-top:8px}
label{display:block;margin-top:14px;color:#ccc}nav{position:fixed;bottom:0;left:0;right:0;height:72px;background:#111;border-top:1px solid #292929;display:flex;justify-content:space-around;align-items:center}nav button{background:none;border:0;color:#888;font-size:12px}nav .on{color:#d9a441}
</style></head>
<body>
<header><div class="logo">SMASH <span class="gold">ZONE</span></div><button class="cart" onclick="cartPage()">🛒 <span id="count">0</span></button></header>
<main>
<section id="home"><div class="hero"><h1>SMASH IT.</h1><p>طازج • ساخن • لذيذ 🔥</p><p>📍 العامرات — بالقرب من جامع الصحابة</p></div>
<h2 class="title">القائمة</h2><div class="tabs" id="tabs"></div><div id="products"></div></section>
<section id="cartPage" style="display:none"><h2 class="title">سلة الطلب 🛒</h2><div id="cart"></div><div class="total"><span>الإجمالي</span><span id="total">0.00 ر.ع</span></div>
<h2 class="title">بيانات التوصيل</h2><label>الاسم<input id="name" placeholder="اسمك"></label><label>رقم الهاتف<input id="phone" placeholder="رقم الهاتف"></label><label>العنوان<input id="address" placeholder="منطقة التوصيل"></label>
<div class="note">🚗 التوصيل داخل نطاق SMASH ZONE فقط. نقطة المطعم: العامرات، قرب جامع الصحابة.</div><button class="btn goldBtn" onclick="order()">تأكيد الطلب</button><button class="btn darkBtn" onclick="home()">العودة للقائمة</button></section>
<section id="account" style="display:none"><h2 class="title">حسابي 👤</h2><div class="card" style="display:block"><div class="name">حساب SMASH ZONE</div><div class="desc">احفظ بياناتك لتسهيل طلباتك القادمة.</div></div>
<label>الاسم<input id="an" placeholder="اسمك"></label><label>رقم الهاتف<input id="ap" placeholder="رقم الهاتف"></label><label>العنوان المفضل<input id="aa" placeholder="العنوان"></label>
<button class="btn goldBtn" onclick="save()">حفظ الحساب</button><div id="saved" class="note" style="display:none"></div></section>
</main>
<nav><button class="on" onclick="home()">🏠<br>الرئيسية</button><button onclick="cartPage()">🛒<br>السلة</button><button onclick="account()">👤<br>حسابي</button></nav>
<script>
const products=[
{id:1,n:"SMASH Classic",d:"لحم سماش، جبن، صوص خاص",p:1.9,e:"🍔",c:"برجر"},
{id:2,n:"Double SMASH",d:"قطعتان لحم سماش، جبن وصوص",p:2.5,e:"🍔",c:"برجر"},
{id:3,n:"SMASH Spicy",d:"لحم سماش، جبن، هالبينو وصوص حار",p:2.2,e:"🌶️",c:"برجر"},
{id:4,n:"SMASH Chicken",d:"دجاج مقرمش، جبن، صوص",p:1.7,e:"🍗",c:"دجاج"},
{id:5,n:"Chicken Crunch",d:"دجاج مقرمش، خس، جبن وصوص",p:1.9,e:"🍗",c:"دجاج"},
{id:6,n:"شاورما بالصوص",d:"شاورما مع صوص SMASH ZONE",p:1.3,e:"🌯",c:"شاورما"},
{id:7,n:"تويستر حار",d:"تويستر دجاج حار مع صوص",p:1.5,e:"🌯",c:"شاورما"},
{id:8,n:"SMASH Box",d:"برجر + بطاطس + مشروب",p:3.2,e:"🍱",c:"وجبات"},
{id:9,n:"Kids SMASH",d:"برجر صغير + بطاطس + عصير",p:1.8,e:"👦",c:"وجبات"},
{id:10,n:"خبز عربي",d:"خبز عربي طازج",p:.3,e:"🫓",c:"إضافات"},
{id:11,n:"SMASH Fries",d:"بطاطس مع صوص المطعم",p:.8,e:"🍟",c:"إضافات"},
{id:12,n:"Cheese Fries",d:"بطاطس مع صوص الجبن",p:1.2,e:"🍟",c:"إضافات"},
{id:13,n:"Cola",d:"مشروب غازي بارد",p:.5,e:"🥤",c:"مشروبات"},
{id:14,n:"Water",d:"مياه معدنية",p:.2,e:"💧",c:"مشروبات"}];
let cart=[];
const cats=["الكل","برجر","دجاج","شاورما","وجبات","إضافات","مشروبات"];
tabs.innerHTML=cats.map((x,i)=>`<button class="tab ${i===0?"active":""}" onclick="filter('${x}',this)">${x}</button>`).join("");
function render(list=products){productsEl.innerHTML=list.map(x=>`<div class="card"><div class="emoji">${x.e}</div><div class="info"><div class="name">${x.n}</div><div class="desc">${x.d}</div><div class="price">${x.p.toFixed(2)} ر.ع</div></div><button class="add" onclick="add(${x.id})">+</button></div>`).join("")}
render();
function filter(c,b){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");render(c==="الكل"?products:products.filter(x=>x.c===c))}
function add(id){cart.push(products.find(x=>x.id===id));update();cartPage()}
function update(){count.textContent=cart.length;cartEl=cart.map(x=>`<div class="row"><span style="font-size:28px;margin-left:10px">${x.e}</span><div class="info"><div class="name">${x.n}</div><div class="price">${x.p.toFixed(2)} ر.ع</div></div></div>`).join("")||"<div class='note'>السلة فارغة.</div>";document.getElementById("cart").innerHTML=cartEl;total.textContent=cart.reduce((a,x)=>a+x.p,0).toFixed(2)+" ر.ع"}
function hide(){homeEl.style.display="none";cartPageEl.style.display="none";accountEl.style.display="none"}
function home(){hide();homeEl.style.display="block";scrollTo(0,0)}
function cartPage(){hide();cartPageEl.style.display="block";update();scrollTo(0,0)}
function account(){hide();accountEl.style.display="block";let a=JSON.parse(localStorage.getItem("smashAccount")||"null");if(a){an.value=a.n;ap.value=a.p;aa.value=a.a;saved.style.display="block";saved.textContent="بياناتك محفوظة ✅"}scrollTo(0,0)}
function save(){if(!an.value||!ap.value)return alert("اكتب الاسم ورقم الهاتف");localStorage.setItem("smashAccount",JSON.stringify({n:an.value,p:ap.value,a:aa.value}));saved.style.display="block";saved.textContent="تم حفظ الحساب بنجاح ✅"}
function order(){if(!cart.length)return alert("أضف منتجات أولاً");if(!name.value||!phone.value||!address.value)return alert("أكمل بيانات التوصيل");alert("تم تسجيل الطلب تجريبيًا ✅")}
const homeEl=document.getElementById("home"),cartPageEl=document.getElementById("cartPage"),accountEl=document.getElementById("account");
</script></body></html>
